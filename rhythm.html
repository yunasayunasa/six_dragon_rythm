<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e9e4d6" />
<title>漢字リズム</title>
</head>
<body data-screen="title">
<!-- 墨絵の背景（three.js の舞台） -->
<div id="stage3d"></div>

<!-- プレイ画面 -->
<div id="ui">
  <header id="hud">
    <div id="char">　</div>
    <div id="mid"><div id="phase">　</div><div id="judge">　</div></div>
    <div id="stats"><div id="combo">COMBO 0</div><div id="score">0</div></div>
    <div id="gauge"><div id="gaugeFill"></div></div>
  </header>
  <div id="field">
    <div id="writerHost"></div>
    <div id="wrap"><canvas id="board"></canvas></div>
  </div>
</div>

<!-- 終幕: 暗転と落款 -->
<div id="fade"></div>
<div id="seal" aria-hidden="true">六竜</div>

<!-- タイトル -->
<section id="title" class="screen">
  <h1>漢字リズム</h1>
  <p class="sub">筆の拍に乗って、書き返せ</p>
  <p class="tap">タップでスタート</p>
  <p class="credit">字の画データ: KanjiVG (CC BY-SA 3.0) をもとに改変</p>
</section>

<!-- 遊び方（1画面） -->
<section id="howto" class="screen">
  <h2>遊び方</h2>
  <ol>
    <li><b>お手本を見る</b><span>筆の動きと画の順番を覚えます。</span></li>
    <li><b>拍に合わせてなぞる</b><span>赤い輪が縮んで小さくなる瞬間に、同じ順番・同じ向きで書き出します。</span></li>
    <li><b>最後は大書き</b><span>「天」を一画ずつ大きく。Miss しても曲は止まりません。</span></li>
  </ol>
  <p class="tap">タップではじめる</p>
</section>

<!-- リザルト -->
<section id="result" class="screen">
  <div class="rank-row">
    <div id="rank">S</div>
    <div class="rank-side"><div id="resScore">0</div><div id="resAcc">精度 0%</div></div>
  </div>
  <dl class="counts">
    <div class="perfect"><dt>PERFECT</dt><dd id="resPerfect">0</dd></div>
    <div class="good"><dt>GOOD</dt><dd id="resGood">0</dd></div>
    <div class="miss"><dt>MISS</dt><dd id="resMiss">0</dd></div>
    <div><dt>最大コンボ</dt><dd id="resCombo">0</dd></div>
  </dl>
  <div id="thumbs"></div>
  <div class="buttons">
    <button id="again" type="button">もう一度</button>
    <button id="toTitle" type="button" class="quiet">タイトルへ</button>
  </div>
</section>

<script type="module" src="/src/rhythm/main.ts"></script>
</body>
</html>
